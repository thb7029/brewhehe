<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🗿 RESONANCE of MOAI 🗿</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        canvas { background: #020202; cursor: pointer; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .btn { 
            position: absolute; left: 20px; width: 120px; padding: 10px;
            background: rgba(255, 255, 255, 0.1); color: #888; font-size: 14px; font-weight: bold;
            text-align: center; cursor: pointer; border: 1px solid #444; border-radius: 4px;
            transition: 0.2s; z-index: 10; user-select: none;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.2); }
        .btn.on { color: #fff; border-color: #fff; background: rgba(255, 255, 255, 0.25); }
        #m { top: 20px; }
        #d-btn { top: 65px; }
        #debug-info { 
            position: absolute; top: 110px; left: 20px; color: #0f0; font-family: monospace; font-size: 11px;
            background: rgba(0, 0, 0, 0.5); padding: 5px; pointer-events: none; border-left: 2px solid #0f0;
            display: none;
        }
        #hint { 
            position: absolute; bottom: 20px; left: 20px; color: #444; font-size: 10px;
            line-height: 1.4; letter-spacing: 0.5px; pointer-events: none; user-select: none;
        }
    </style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<div id="m" class="btn">SOUND: OFF</div>
<div id="d-btn" class="btn">DEBUG: OFF</div>
<div id="debug-info">DEBUG MODE</div>
<div id="hint">
    NOTE:Rings shatter after 25 hits.<br>
    (ver 1.21: Add sound & midi)
</div>

<script>
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const cx = 300, cy = 300, gravity = 0.1, steps = 6;
const debugEl = document.getElementById("debug-info");
const dBtn = document.getElementById("d-btn");
const mBtn = document.getElementById("m");

let ball, rings, ringCount, atkBuffer, clearSound, melodyNotes = [], melodyIndex = 0;
let isMuted = true, isDebug = false;
let totalRingsAtStart = 0;
let currentTargetIndex = -1;
let currentHitCount = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const mainGain = audioCtx.createGain();
mainGain.gain.value = 0.4;
mainGain.connect(audioCtx.destination);

const atkFiles = ["audio/atk1.mp3","audio/atk2.mp3","audio/atk3.mp3","audio/atk4.mp3","audio/atk5.mp3","audio/atk6.mp3","audio/atk7.mp3","audio/atk8.mp3",
                  "audio/atk9.mp3","audio/atk10.mp3","audio/atk11.mp3","audio/atk12.mp3","audio/atk13.mp3","audio/atk14.mp3","audio/atk15.mp3","audio/atk16.mp3"];
const clrFiles = ["audio/clr1.mp3","audio/clr2.mp3","audio/clr3.mp3","audio/clr4.mp3","audio/clr5.mp3","audio/clr6.mp3","audio/clr7.mp3","audio/clr8.mp3","audio/clr9.mp3","audio/clr10.mp3",
                  "audio/clr11.mp3","audio/clr12.mp3","audio/clr13.mp3","audio/clr14.mp3","audio/clr15.mp3","audio/clr16.mp3","audio/clr17.mp3","audio/clr18.mp3","audio/clr19.mp3","audio/clr20.mp3"];
const midiFiles = ["midi/melody1.mid","midi/melody2.mid","midi/melody3.mid","midi/melody4.mid","midi/melody5.mid",
                   "midi/melody6.mid","midi/melody7.mid","midi/melody8.mid","midi/melody9.mid","midi/melody10.mid"];

const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (start, end, t) => start * (1 - t) + end * t;
const normalizeAngle = (a) => {
    const twoPi = Math.PI * 2;
    return ((a % twoPi) + twoPi) % twoPi;
};

// 色の補間用ヘルパー
function lerpHue(h1, h2, t) {
    let diff = h2 - h1;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;
    return (h1 + diff * t + 360) % 360;
}

async function loadAtkSound(url) {
    try {
        const res = await fetch(url), buf = await res.arrayBuffer();
        atkBuffer = await audioCtx.decodeAudioData(buf);
    } catch(e) { console.warn("Sound load failed - playing fallback"); }
}

async function loadMidi(file) {
    try {
        const res = await fetch(file), buf = await res.arrayBuffer();
        const midi = new Midi(buf);
        melodyNotes = midi.tracks[0].notes.map(n => n.midi);
        melodyIndex = 0;
    } catch(e) { 
        melodyNotes = [60, 62, 64, 65, 67, 69, 71, 72]; 
    }
}

function collisionSound() {
    if (isMuted || !atkBuffer || !melodyNotes.length) return;
    const s = audioCtx.createBufferSource();
    s.buffer = atkBuffer;
    s.playbackRate.value = Math.pow(2, (melodyNotes[melodyIndex] - 48) / 12);
    s.connect(mainGain);
    s.start(0);
    melodyIndex = (melodyIndex + 1) % melodyNotes.length;
}

function passSound() {
    if (isMuted || !clearSound) return;
    const s = clearSound.cloneNode();
    s.volume = 0.4;
    s.play();
}

mBtn.onclick = () => {
    isMuted = !isMuted;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    mBtn.innerText = `SOUND: ${isMuted ? 'OFF' : 'ON'}`;
    mBtn.className = isMuted ? 'btn' : 'btn on';
};

dBtn.onclick = () => {
    isDebug = !isDebug;
    dBtn.innerText = `DEBUG: ${isDebug ? 'ON' : 'OFF'}`;
    dBtn.className = isDebug ? 'btn on' : 'btn';
    debugEl.style.display = isDebug ? 'block' : 'none';
};

function reset() {
    const initSpeed = 0.6;
    const ang = Math.random() * Math.PI * 2;
    ball = { 
        x: cx, y: cy, 
        vx: Math.cos(ang) * initSpeed, vy: Math.sin(ang) * initSpeed, 
        r: 6, cooldown: 0, 
        baseSpeed: initSpeed, maxSpeed: initSpeed * 3.0 
    };
    
    rings = [];
    ringCount = 6 + Math.floor(Math.random() * 8);
    totalRingsAtStart = ringCount;
    const spacing = 200 / (ringCount - 1 || 1);
    const baseGapAngle = Math.random() * Math.PI * 2;

    // --- 色彩設計：まず2色を確定させる ---
    const colorA = {
        h: Math.random() * 360,
        s: 20 + Math.random() * 80,
        l: 20 + Math.random() * 55
    };
    const colorB = {
        h: (colorA.h + (40 + Math.random() * 140)) % 360,
        s: 20 + Math.random() * 80,
        l: 20 + Math.random() * 55
    };

    const isGradient = Math.random() < 0.5;

    // --- 回転パターンの設計 ---
    const pattern = Math.floor(Math.random() * 3);
    const minS = 0.005, maxS = 0.045, minDiff = 0.008;
    let speedInner = Math.random() * (maxS - minS) + minS;
    let speedOuter = Math.random() * (maxS - minS) + minS;
    if (Math.abs(speedInner - speedOuter) < minDiff) {
        speedOuter = speedInner + (speedInner > (maxS+minS)/2 ? -minDiff : minDiff);
    }

    for (let i = 0; i < ringCount; i++) {
        const t = i / (ringCount - 1 || 1);
        let s = lerp(speedInner, speedOuter, t);
        let dir = (pattern === 0) ? 1 : (pattern === 1) ? -1 : (i % 2 === 0 ? 1 : -1);

        // キーカラーに基づいた色の割り当て
        let h, sat, lit;
        if (isGradient) {
            h = lerpHue(colorA.h, colorB.h, t);
            sat = lerp(colorA.s, colorB.s, t);
            lit = lerp(colorA.l, colorB.l, t);
        } else {
            const pick = (i % 2 === 0) ? colorA : colorB;
            h = pick.h; sat = pick.s; lit = pick.l;
        }

        rings.push({
            r: 70 + spacing * i,
            gap: baseGapAngle,
            gapSize: (Math.PI * 2) / 5.5,
            angle: 0,
            speed: s * dir,
            index: i,
            passed: false,
            hitCount: 0,
            shouldRemove: false,
            h: h, s: sat, l: lit
        });
    }
    loadAtkSound(pick(atkFiles));
    clearSound = new Audio(pick(clrFiles));
    loadMidi(pick(midiFiles));
}

function physicsStep() {
    ball.vy += gravity / steps;
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.cooldown > 0) ball.cooldown--;
    for (let ring of rings) ring.angle += ring.speed;

    if (rings.length === 0) return;

    const dx = ball.x - cx, dy = ball.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const nx = dx / dist, ny = dy / dist;

    // 最も近いリングを特定
    const closestRing = rings.reduce((prev, curr) => (Math.abs(dist - curr.r) < Math.abs(dist - prev.r)) ? curr : prev);
    currentTargetIndex = closestRing.index;
    currentHitCount = closestRing.hitCount;

    // --- 角度判定 ---
    const ballAngle = normalizeAngle(Math.atan2(dy, dx));
    const gapStart = normalizeAngle(closestRing.gap + closestRing.angle);
    const gapEnd = normalizeAngle(gapStart + closestRing.gapSize);

    // 隙間にいるかの判定（少し余裕を持たせる）
    let inGap = (gapStart < gapEnd) 
        ? (ballAngle >= gapStart && ballAngle <= gapEnd) 
        : (ballAngle >= gapStart || ballAngle <= gapEnd);

    // --- 1. 消去判定（25回衝突 または 隙間を通過） ---
    // すでに衝突回数が25回を超えている、または隙間にいてリングの外側に突き抜けた場合
    if (closestRing.hitCount >= 25 || (inGap && dist > closestRing.r)) {
        // 判定：リングの境界を跨いだ瞬間
        if (dist > closestRing.r - ball.r) {
            passSound();
            closestRing.shouldRemove = true;
            // ボールを確実に外側へ押し出す（スタック防止）
            ball.x = cx + nx * (closestRing.r + ball.r + 3);
            ball.y = cy + ny * (closestRing.r + ball.r + 3);
        }
    } 
    // --- 2. 通常の衝突（反射）判定 ---
    else if (!inGap && Math.abs(dist - closestRing.r) < ball.r) {
        const dot = ball.vx * nx + ball.vy * ny;
        // 外側に向かって進んでいるときのみ反射
        if (dot > 0 && ball.cooldown === 0) {
            closestRing.hitCount++;
            
            let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            if (speed < ball.maxSpeed) speed *= 1.05;
            
            ball.vx -= 2 * dot * nx;
            ball.vy -= 2 * dot * ny;
            
            const newSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
            ball.vx = (ball.vx / newSpeed) * speed;
            ball.vy = (ball.vy / newSpeed) * speed;
            
            // リングの内側に押し戻す
            ball.x = cx + nx * (closestRing.r - ball.r - 2);
            ball.y = cy + ny * (closestRing.r - ball.r - 2);
            ball.cooldown = 2;
            collisionSound();
        }
    }

    // リングをリストから削除
    if (closestRing.shouldRemove) {
        rings = rings.filter(r => r !== closestRing);
    }

}function update() {
    for (let i = 0; i < steps; i++) physicsStep();
    if (isDebug) debugEl.innerHTML = `TOTAL: ${totalRingsAtStart}<br>LEFT : ${rings.length}<br>TARGET: ${currentTargetIndex}<br>HIT : ${currentHitCount}/25`;
    if (rings.length === 0 && (ball.x < -100 || ball.x > 700 || ball.y < -100 || ball.y > 700)) reset();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    rings.forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, r.r, r.gap + r.angle + r.gapSize, r.gap + r.angle, false);
        
        const isTarget = isDebug && (r.index === currentTargetIndex);
        let lightness = r.l;
        if (isTarget) lightness = 80;

        ctx.strokeStyle = `hsl(${r.h}, ${r.s}%, ${lightness}%)`;
        ctx.lineWidth = isTarget ? 7 : 5;
        ctx.lineCap = "round";
        ctx.stroke();
    });

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.shadowBlur = 0;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
reset();
loop();
</script>
</body>
</html>
