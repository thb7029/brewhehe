<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🗿🗿🗿🗿🗿🗿🗿🗿🗿</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        canvas { background: #111; cursor: pointer; }
        #m { 
            position: absolute; top: 20px; left: 20px; width: 120px; padding: 10px;
            background: rgba(255, 255, 255, 0.1); color: #888; font-size: 14px; font-weight: bold;
            text-align: center; cursor: pointer; border: 1px solid #444; border-radius: 4px;
            transition: 0.2s; z-index: 10; user-select: none;
        }
        #m.on { color: #fff; border-color: #fff; background: rgba(255, 255, 255, 0.25); }
        #debug { 
            position: absolute; top: 65px; left: 20px; color: #0f0; font-family: monospace; font-size: 11px;
            background: rgba(0, 0, 0, 0.5); padding: 5px; pointer-events: none; border-left: 2px solid #0f0;
        }
        #hint { 
            position: absolute; bottom: 20px; left: 20px; color: #444; font-size: 10px;
            letter-spacing: 0.5px; pointer-events: none; user-select: none;
        }
    </style>
</head>
<body>

<canvas id="c" width="600" height="600"></canvas>
<div id="m">SOUND: OFF</div>
<div id="debug">DEBUG MODE</div>
<div id="hint">Rings shatter after 25 hits to prevent stuck. (ver 0.35)</div>

<script>
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const cx = 300, cy = 300, gravity = 0.1, steps = 4;
const debugEl = document.getElementById("debug");
let ball, rings, ringCount, atkBuffer, clearSound, melodyNotes = [], melodyIndex = 0, isMuted = true;
let totalRingsAtStart = 0;
let currentTargetIndex = -1;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const mainGain = audioCtx.createGain();
mainGain.gain.value = 0.4;
mainGain.connect(audioCtx.destination);

const mBtn = document.getElementById("m");
const atkFiles = ["audio/atk1.mp3","audio/atk2.mp3","audio/atk3.mp3","audio/atk4.mp3","audio/atk5.mp3","audio/atk6.mp3","audio/atk7.mp3","audio/atk8.mp3"];
const clrFiles = ["audio/clr1.mp3","audio/clr2.mp3","audio/clr3.mp3","audio/clr4.mp3","audio/clr5.mp3","audio/clr6.mp3","audio/clr7.mp3","audio/clr8.mp3"];
const midiFiles = ["midi/melody1.mid","midi/melody2.mid","midi/melody3.mid","midi/melody4.mid","midi/melody5.mid"];

const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (start, end, t) => start * (1 - t) + end * t;

async function loadAtkSound(url) {
    atkBuffer = null;
    const res = await fetch(url), buf = await res.arrayBuffer();
    atkBuffer = await audioCtx.decodeAudioData(buf);
}

async function loadMidi(file) {
    const res = await fetch(file), buf = await res.arrayBuffer();
    const midi = new Midi(buf);
    melodyNotes = midi.tracks[0].notes.map(n => n.midi);
    melodyIndex = 0;
}

function collisionSound() {
    if (isMuted || !atkBuffer || !melodyNotes.length) return;
    const s = audioCtx.createBufferSource();
    s.buffer = atkBuffer;
    s.playbackRate.value = Math.pow(2, (melodyNotes[melodyIndex] - 48) / 12);
    s.connect(mainGain);
    s.start(0);
    melodyIndex = (melodyIndex + 1) % melodyNotes.length;
}

function passSound() {
    if (isMuted) return;
    const s = clearSound.cloneNode();
    s.volume = 0.4;
    s.play();
}

mBtn.onclick = () => {
    isMuted = !isMuted;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    mBtn.innerText = `SOUND: ${isMuted ? 'OFF' : 'ON'}`;
    mBtn.className = isMuted ? '' : 'on';
};

function reset() {
    const initSpeed = 0.8;
    const ang = Math.random() * Math.PI * 2;
    ball = { 
        x: cx, y: cy, 
        vx: Math.cos(ang) * initSpeed, vy: Math.sin(ang) * initSpeed, 
        r: 5, cooldown: 0, 
        lastPassedRadius: 0,
        baseSpeed: initSpeed, maxSpeed: initSpeed * 2.5 
    };
    rings = [];
    
    const colorMode = Math.random() < 0.5 ? "gradient" : "alternate";
    const hueA = Math.random() * 360, hueB = hueA + (Math.random() * 100 + 40);
    const baseSat = 40 + Math.random() * 50, baseLight = 40 + Math.random() * 30; 

    ringCount = 6 + Math.floor(Math.random() * 10);
    totalRingsAtStart = ringCount;
    const spacing = 200 / (ringCount - 1);
    const baseGap = Math.random() * Math.PI * 2;

    const dir = Math.random() < 0.5 ? 1 : -1;
    const minS = 0.012, maxS = 0.045, minDiff = 0.012;
    const innerSpeed = (Math.random() * (maxS - minS) + minS) * dir;
    let outerSpeed;
    do { outerSpeed = (Math.random() * (maxS - minS) + minS) * dir; } 
    while (Math.abs(Math.abs(innerSpeed) - Math.abs(outerSpeed)) < minDiff);

    for (let i = 0; i < ringCount; i++) {
        rings.push({
            r: 65 + spacing * i,
            gap: baseGap,
            gapSize: (Math.PI * 2) / 5,
            angle: 0,
            speed: lerp(innerSpeed, outerSpeed, i / (ringCount - 1)),
            index: i,
            passed: false,
            hitCount: 0,
            shouldRemove: false,
            colorMode, colorA: hueA, colorB: hueB,
            sat: baseSat, light: baseLight
        });
    }
    loadAtkSound(pick(atkFiles));
    clearSound = new Audio(pick(clrFiles));
    loadMidi(pick(midiFiles));
}

function physicsStep() {
    ball.vy += gravity / steps;
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.cooldown > 0) ball.cooldown--;

    for (let ring of rings) ring.angle += ring.speed;

    if (rings.length === 0) {
        currentTargetIndex = -1;
        return;
    }

    const dx = ball.x - cx, dy = ball.y - cy;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const nx = dx / dist, ny = dy / dist;
    
    const closestRing = rings.reduce((prev, curr) => {
        return (Math.abs(dist - curr.r) < Math.abs(dist - prev.r)) ? curr : prev;
    });

    currentTargetIndex = closestRing.index;
    const diff = dist - closestRing.r;

    // A: 確実に「外」に出た判定 (マージンを追加)
    if (diff > ball.r - 1) {
        const a = (Math.atan2(dy, dx) + Math.PI * 10) % (Math.PI * 2);
        const s = (closestRing.gap + closestRing.angle + Math.PI * 10) % (Math.PI * 2);
        const e = (s + closestRing.gapSize) % (Math.PI * 2);
        const inGap = s < e ? (a > s && a < e) : (a > s || a < e);

        if (inGap || closestRing.hitCount >= 25) {
            if (!closestRing.passed) {
                passSound(); 
                closestRing.passed = true;
            }
            closestRing.shouldRemove = true;
            ball.lastPassedRadius = closestRing.r + ball.r + 2; // 通過後、安全圏まで記録を飛ばす
            // 強制的に外側へわずかにワープさせてスタックを防ぐ
            ball.x = cx + nx * (closestRing.r + ball.r + 3);
            ball.y = cy + ny * (closestRing.r + ball.r + 3);
        }
    } 
    // B: 衝突判定 (直前の通過半径より確実に外にいる場合のみ)
    else if (Math.abs(diff) < ball.r && dist > ball.lastPassedRadius) {
        const a = (Math.atan2(dy, dx) + Math.PI * 10) % (Math.PI * 2);
        const s = (closestRing.gap + closestRing.angle + Math.PI * 10) % (Math.PI * 2);
        const e = (s + closestRing.gapSize) % (Math.PI * 2);
        const inGap = s < e ? (a > s && a < e) : (a > s || a < e);

        if (!inGap && ball.cooldown === 0) {
            const dot = ball.vx * nx + ball.vy * ny;
            if (dot > 0) {
                closestRing.hitCount++;
                let speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                if (speed < ball.maxSpeed) speed *= 1.05;

                ball.vx -= 2 * dot * nx;
                ball.vy -= 2 * dot * ny;

                const newSpeed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                ball.vx = (ball.vx / newSpeed) * speed;
                ball.vy = (ball.vy / newSpeed) * speed;

                ball.x = cx + nx * (closestRing.r - ball.r - 2);
                ball.y = cy + ny * (closestRing.r - ball.r - 2);
                ball.cooldown = 2;
                collisionSound();
            }
        }
    }

    if (closestRing.shouldRemove) {
        rings = rings.filter(r => !r.shouldRemove);
    }
}

function update() {
    for (let i = 0; i < steps; i++) physicsStep();
    debugEl.innerHTML = `TOTAL RINGS: ${totalRingsAtStart}<br>REMAINING  : ${rings.length}<br>TARGET IDX : ${currentTargetIndex === -1 ? "NONE" : currentTargetIndex}`;
    if (rings.length === 0 && (ball.x < -100 || ball.x > 700 || ball.y < -100 || ball.y > 700)) reset();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    rings.forEach(r => {
        let hue = (r.colorMode === "alternate") ? (r.index % 2 === 0 ? r.colorA : r.colorB) : r.colorA + (r.colorB - r.colorA) * (r.index / (totalRingsAtStart - 1 || 1));
        ctx.beginPath();
        ctx.arc(cx, cy, r.r, r.gap + r.angle + r.gapSize, r.gap + r.angle, false);
        const isTarget = (r.index === currentTargetIndex);
        ctx.strokeStyle = `hsl(${hue}, ${r.sat}%, ${isTarget ? r.light + 20 : r.light}%)`;
        ctx.lineWidth = isTarget ? 6 : 4;
        ctx.stroke();
    });
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
reset();
loop();
</script>
</body>
</html>
