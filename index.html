<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>🗿🗿🗿🗿🗿🗿🗿🗿🗿</title>

<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>

<style>
body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

canvas{
background:#111;
}
</style>

</head>
<body>

<canvas id="c" width="600" height="600"></canvas>

<script>

const canvas = document.getElementById("c")
const ctx = canvas.getContext("2d")

const cx = canvas.width/2
const cy = canvas.height/2

const gravity = 0.10
const steps = 3
const gravityStep = gravity/steps
const restitution = 1.0

let ball
let rings
let ringCount

// -------- AUDIO --------
// Web Audio APIのコンテキストを作成（ブラウザ標準機能なので追加準備不要）
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

const atkFiles = [
"audio/atk1.mp3","audio/atk2.mp3","audio/atk3.mp3","audio/atk4.mp3",
"audio/atk5.mp3","audio/atk6.mp3","audio/atk7.mp3","audio/atk8.mp3"
]

const clrFiles = [
"audio/clr1.mp3","audio/clr2.mp3","audio/clr3.mp3","audio/clr4.mp3",
"audio/clr5.mp3","audio/clr6.mp3","audio/clr7.mp3","audio/clr8.mp3"
]

const midiFiles = [
"midi/melody1.mid",
"midi/melody2.mid",
"midi/melody3.mid",
"midi/melody4.mid",
"midi/melody5.mid"
]

let atkBuffer = null; 
let clearSound;

let melodyNotes=[]
let melodyIndex=0

// C3(48)を基準にする
let baseNote=48

function randomChoice(arr){
return arr[Math.floor(Math.random()*arr.length)]
}

// 修正：再生速度を計算する関数
function midiToRate(note){
return Math.pow(2,(note-baseNote)/12)
}

// 修正：atkファイルをAudioBufferとして読み込む
async function loadAtkSound(url) {
    const response = await fetch(url);
    const arrayBuffer = await response.arrayBuffer();
    atkBuffer = await audioCtx.decodeAudioData(arrayBuffer);
}

async function loadMidi(file){
const res = await fetch(file)
const buffer = await res.arrayBuffer()
const midi = new Midi(buffer)
const track = midi.tracks[0]
melodyNotes = track.notes.map(n=>n.midi)
melodyIndex = 0
}

// 修正：ピッチ変更を確実に反映させる再生処理
function collisionSound(){
if(!atkBuffer || melodyNotes.length===0) return

// ブラウザの音再生制限対策
if (audioCtx.state === 'suspended') {
    audioCtx.resume();
}

const note = melodyNotes[melodyIndex]
const rate = midiToRate(note)

// AudioBufferSourceNodeを使って再生（これならplaybackRateが即座に効く）
const source = audioCtx.createBufferSource();
source.buffer = atkBuffer;
source.playbackRate.value = rate; 
source.connect(audioCtx.destination);
source.start(0);

melodyIndex = (melodyIndex + 1) % melodyNotes.length;
}

function passSound(){
const s = clearSound.cloneNode()
s.play()
}

// 画面クリックでAudioContextを有効化（必須）
window.addEventListener('mousedown', () => {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
});

  
// -------- COLOR --------

function randomColor(){
return `hsl(${Math.random()*360},70%,60%)`
}

// -------- RESET --------

function reset(){

const speed = 0.7
const angle = Math.random()*Math.PI*2

ball={
x:cx,
y:cy,
vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed,
r:5,
cooldown:0
}

rings=[]

const colorMode = Math.random()<0.5 ? "gradient":"alternate"

let colorA
let colorB

if(colorMode==="alternate"){

const baseHue = Math.random()*360
const offset = (Math.random()*100)+40

colorA = baseHue
colorB = baseHue + offset

}else{

const baseHue = Math.random()*360
const offset = (Math.random()*40)+40

colorA = baseHue
colorB = baseHue + offset
}

ringCount = 6 + Math.floor(Math.random()*13)

const minRadius = 60
const maxRadius = 260
const spacing = (maxRadius-minRadius)/(ringCount-1)

const mode = Math.floor(Math.random()*3)
const scaleMode = Math.random()<0.5 ? "faster":"slower"

const baseSpeed = Math.random()*0.02+0.015
const baseGap = Math.random()*Math.PI*2

const gapSize = (Math.PI*2)/6

for(let i=0;i<ringCount;i++){

let dir=1

if(mode===0) dir=1
if(mode===1) dir=-1
if(mode===2) dir=(i%2===0?1:-1)

let factor

if(scaleMode==="faster"){
factor=1+i*0.15
}else{
factor=1/(1+i*0.15)
}

rings.push({

r:minRadius + spacing*i,
gap:baseGap,
gapSize:gapSize,
angle:0,
speed:baseSpeed*factor*dir,

index:i,
passed:false,

colorMode:colorMode,
colorA:colorA,
colorB:colorB

})

}

// AUDIO INIT

loadAtkSound(randomChoice(atkFiles)) // attackSoundではなくloadAtkSoundを使う
clearSound = new Audio(randomChoice(clrFiles))
loadMidi(randomChoice(midiFiles))

}
// -------- PHYSICS --------

function physicsStep(){
    ball.vy += gravityStep;
    ball.x += ball.vx;
    ball.y += ball.vy;

    if(ball.cooldown > 0) ball.cooldown--;

    for(let ring of rings) {
        ring.angle += ring.speed;
    }

    let dx = ball.x - cx;
    let dy = ball.y - cy;
    let dist = Math.sqrt(dx*dx + dy*dy);

    for(let i = rings.length - 1; i >= 0; i--){
        let ring = rings[i];

        // 1. リングを完全に通り抜けた判定
        if(dist > ring.r + ball.r) {
            if(!ring.passed) {
                // 通過判定をここで行う
                let a = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
                let s = (ring.gap + ring.angle + Math.PI * 2) % (Math.PI * 2);
                let e = (s + ring.gapSize) % (Math.PI * 2);
                
                let inGap = s < e ? (a > s && a < e) : (a > s || a e);
                if(inGap) {
                    passSound();
                    ring.passed = true;
                }
            }
            rings.splice(i, 1);
            continue;
        }

        // 2. 衝突判定（リングの厚みの中にボールがいるか）
        if(dist > ring.r - ball.r && dist < ring.r + ball.r) {
            let a = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
            let s = (ring.gap + ring.angle + Math.PI * 2) % (Math.PI * 2);
            let e = (s + ring.gapSize) % (Math.PI * 2);

            let inGap = s < e ? (a > s && a < e) : (a > s || a < e);

            // 穴の中に「いない」時だけ跳ね返す
            if(!inGap && ball.cooldown === 0) {
                let nx = dx / dist;
                let ny = dy / dist;

                let speedBefore = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                let dot = ball.vx * nx + ball.vy * ny;

                // 反射（法線ベクトル nx, ny を使用）
                ball.vx -= 2 * dot * nx;
                ball.vy -= 2 * dot * ny;

                // 速度の維持（無限反発）
                let speedAfter = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
                if(speedAfter > 0) {
                    ball.vx = (ball.vx / speedAfter) * speedBefore;
                    ball.vy = (ball.vy / speedAfter) * speedBefore;
                }

                // 強制的に内側に押し戻して、次のフレームで再衝突するのを防ぐ
                ball.x = cx + nx * (ring.r - ball.r - 2);
                ball.y = cy + ny * (ring.r - ball.r - 2);

                ball.cooldown = 2;
                collisionSound();
            }
        }
    }
}

// -------- UPDATE --------

function update(){

for(let i=0;i<steps;i++){
physicsStep()
}

if(
rings.length===0 &&
(ball.x<0||ball.x>canvas.width||ball.y<0||ball.y>canvas.height)
){
reset()
}

}

// -------- DRAW --------

function draw(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for(let ring of rings){
        let color;
        if(ring.colorMode === "alternate"){
            color = ring.index % 2 === 0 ? `hsl(${ring.colorA},70%,60%)` : `hsl(${ring.colorB},70%,60%)`;
        } else {
            const t = ring.index / (ringCount - 1);
            const hue = ring.colorA * (1 - t) + ring.colorB * t;
            color = `hsl(${hue}, 70%, 60%)`;
        }

        ctx.beginPath();
        // 重要：判定ロジック(s, e)と同じ角度で「線」を描く
        // 穴の開始(gap + angle + gapSize)から、穴の開始(gap + angle)まで「ぐるっと一周」描く
        let startAngle = ring.gap + ring.angle + ring.gapSize;
        let endAngle = ring.gap + ring.angle;

        ctx.arc(cx, cy, ring.r, startAngle, endAngle, false); 

        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.stroke();
    }

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
}
// -------- LOOP --------

function loop(){

update()
draw()

requestAnimationFrame(loop)

}

reset()
loop()

</script>

</body>
</html>
