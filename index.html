<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>gemu</title>

<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>

<style>
body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

canvas{
background:#111;
}
</style>

</head>
<body>

<canvas id="c" width="600" height="600"></canvas>

<script>

const canvas = document.getElementById("c")
const ctx = canvas.getContext("2d")

const cx = canvas.width/2
const cy = canvas.height/2

const gravity = 0.10
const steps = 3
const gravityStep = gravity/steps
const restitution = 1.0

let ball
let rings
let ringCount

// -------- AUDIO --------

const atkFiles = [
"audio/atk1.mp3","audio/atk2.mp3","audio/atk3.mp3","audio/atk4.mp3",
"audio/atk5.mp3","audio/atk6.mp3","audio/atk7.mp3","audio/atk8.mp3"
]

const clrFiles = [
"audio/clr1.mp3","audio/clr2.mp3","audio/clr3.mp3","audio/clr4.mp3",
"audio/clr5.mp3","audio/clr6.mp3","audio/clr7.mp3","audio/clr8.mp3"
]

const midiFiles = [
"midi/melody1.mid",
"midi/melody2.mid",
"midi/melody3.mid",
"midi/melody4.mid",
"midi/melody5.mid"
]

let attackSound
let clearSound

let melodyNotes=[]
let melodyIndex=0

let baseNote=60

function randomChoice(arr){
return arr[Math.floor(Math.random()*arr.length)]
}

function midiToRate(note){
return Math.pow(2,(note-baseNote)/12)
}

async function loadMidi(file){

const res = await fetch(file)
const buffer = await res.arrayBuffer()

const midi = new Midi(buffer)

const track = midi.tracks[0]

melodyNotes = track.notes.map(n=>n.midi)

melodyIndex = 0
}

function collisionSound(){

if(melodyNotes.length===0) return

const note = melodyNotes[melodyIndex]

const rate = midiToRate(note)

const s = attackSound.cloneNode()

s.playbackRate = rate
s.play()

melodyIndex++

if(melodyIndex>=melodyNotes.length){
melodyIndex=0
}

}

function passSound(){

const s = clearSound.cloneNode()
s.play()

}

// -------- COLOR --------

function randomColor(){
return `hsl(${Math.random()*360},70%,60%)`
}

// -------- RESET --------

function reset(){

const speed = 0.7
const angle = Math.random()*Math.PI*2

ball={
x:cx,
y:cy,
vx:Math.cos(angle)*speed,
vy:Math.sin(angle)*speed,
r:6,
cooldown:0
}

rings=[]

const colorMode = Math.random()<0.5 ? "gradient":"alternate"

let colorA
let colorB

if(colorMode==="alternate"){

const baseHue = Math.random()*360
const offset = (Math.random()*100)+40

colorA = baseHue
colorB = baseHue + offset

}else{

const baseHue = Math.random()*360
const offset = (Math.random()*40)+40

colorA = baseHue
colorB = baseHue + offset
}

ringCount = 6 + Math.floor(Math.random()*13)

const minRadius = 60
const maxRadius = 260
const spacing = (maxRadius-minRadius)/(ringCount-1)

const mode = Math.floor(Math.random()*3)
const scaleMode = Math.random()<0.5 ? "faster":"slower"

const baseSpeed = Math.random()*0.01+0.005
const baseGap = Math.random()*Math.PI*2

const gapSize = (Math.PI*2)/7

for(let i=0;i<ringCount;i++){

let dir=1

if(mode===0) dir=1
if(mode===1) dir=-1
if(mode===2) dir=(i%2===0?1:-1)

let factor

if(scaleMode==="faster"){
factor=1+i*0.15
}else{
factor=1/(1+i*0.15)
}

rings.push({

r:minRadius + spacing*i,
gap:baseGap,
gapSize:gapSize,
angle:0,
speed:baseSpeed*factor*dir,

index:i,
passed:false,

colorMode:colorMode,
colorA:colorA,
colorB:colorB

})

}

// AUDIO INIT

attackSound = new Audio(randomChoice(atkFiles))
clearSound = new Audio(randomChoice(clrFiles))

loadMidi(randomChoice(midiFiles))

}

// -------- PHYSICS --------

function physicsStep(){

ball.vy += gravityStep

ball.x += ball.vx
ball.y += ball.vy

if(ball.cooldown>0) ball.cooldown--

for(let ring of rings){
ring.angle += ring.speed
}

let dx = ball.x - cx
let dy = ball.y - cy
let dist = Math.sqrt(dx*dx + dy*dy)

for(let i=rings.length-1;i>=0;i--){

let ring = rings[i]

if(dist > ring.r){
rings.splice(i,1)
continue
}

if(dist > ring.r - ball.r){

let ang = Math.atan2(dy,dx)

let gapStart = ring.gap + ring.angle
let gapEnd = gapStart + ring.gapSize

let a=(ang+Math.PI*2)%(Math.PI*2)
let s=(gapStart+Math.PI*2)%(Math.PI*2)
let e=(gapEnd+Math.PI*2)%(Math.PI*2)

let inGap = s<e ? (a>s && a<e) : (a>s || a<e)

if(inGap){

if(!ring.passed){
passSound()
ring.passed = true
}

}else if(ball.cooldown===0){

let nx=dx/dist
let ny=dy/dist

let dot=ball.vx*nx + ball.vy*ny

ball.vx -= (1+restitution)*dot*nx
ball.vy -= (1+restitution)*dot*ny

ball.x = cx + nx*(ring.r - ball.r)
ball.y = cy + ny*(ring.r - ball.r)

ball.cooldown = 1

collisionSound()

}

}

}

}

// -------- UPDATE --------

function update(){

for(let i=0;i<steps;i++){
physicsStep()
}

if(
rings.length===0 &&
(ball.x<0||ball.x>canvas.width||ball.y<0||ball.y>canvas.height)
){
reset()
}

}

// -------- DRAW --------

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

for(let ring of rings){

let color

if(ring.colorMode==="alternate"){

color = ring.index%2===0
? `hsl(${ring.colorA},70%,60%)`
: `hsl(${ring.colorB},70%,60%)`

}else{

const t = ring.index/(ringCount-1)
const hue = ring.colorA*(1-t) + ring.colorB*t

color = `hsl(${hue},70%,60%)`

}

ctx.beginPath()

let start = ring.gap + ring.gapSize + ring.angle
let end = ring.gap + Math.PI*2 + ring.angle

ctx.arc(cx,cy,ring.r,start,end)

ctx.strokeStyle=color
ctx.lineWidth=4
ctx.stroke()

}

ctx.beginPath()
ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2)
ctx.fillStyle="white"
ctx.fill()

}

// -------- LOOP --------

function loop(){

update()
draw()

requestAnimationFrame(loop)

}

reset()
loop()

</script>

</body>
</html>
