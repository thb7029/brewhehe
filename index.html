<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>🗿</title>
    <script src="https://cdn.jsdelivr.net/npm/@tonejs/midi"></script>
    <style>
        body { margin: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        canvas { background: #111; }
    </style>
</head>
<body>
<canvas id="c" width="600" height="600"></canvas>
<script>
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const cx = 300, cy = 300, gravity = 0.1, steps = 3, res = 1.0;
let ball, rings, atkBuffer, clearSound, melodyNotes = [], melodyIndex = 0;

// --- AUDIO SETUP ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const gainNode = audioCtx.createGain();
gainNode.gain.value = 0.5; // 音量調整
gainNode.connect(audioCtx.destination);

const pick = a => a[Math.floor(Math.random() * a.length)];
const loadAtk = async url => {
    const r = await fetch(url), b = await r.arrayBuffer();
    atkBuffer = await audioCtx.decodeAudioData(b);
};
const loadMidi = async url => {
    const r = await fetch(url), b = await r.arrayBuffer();
    melodyNotes = (new Midi(b)).tracks[0].notes.map(n => n.midi);
    melodyIndex = 0;
};

function playAtk() {
    if (!atkBuffer || !melodyNotes.length) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const s = audioCtx.createBufferSource();
    s.buffer = atkBuffer;
    s.playbackRate.value = Math.pow(2, (melodyNotes[melodyIndex] - 48) / 12);
    s.connect(gainNode);
    s.start(0);
    melodyIndex = (melodyIndex + 1) % melodyNotes.length;
}

function playClr() {
    if (!clearSound) return;
    const s = clearSound.cloneNode();
    s.volume = 0.5;
    s.play();
}

window.onclick = () => audioCtx.state === 'suspended' && audioCtx.resume();

// --- LOGIC ---
function reset() {
    const ang = Math.random() * Math.PI * 2;
    ball = { x: cx, y: cy, vx: Math.cos(ang) * 0.7, vy: Math.sin(ang) * 0.7, r: 5, cd: 0 };
    rings = [];
    
    const count = 6 + Math.floor(Math.random() * 13), hA = Math.random() * 360, hB = hA + (Math.random() * 60 + 40);
    const bSpd = Math.random() * 0.02 + 0.015, mode = Math.floor(Math.random() * 3), isFaster = Math.random() < 0.5;

    for (let i = 0; i < count; i++) {
        const dir = mode === 2 ? (i % 2 ? 1 : -1) : (mode === 0 ? 1 : -1);
        const factor = isFaster ? (1 + i * 0.15) : (1 / (1 + i * 0.15));
        rings.push({
            r: 60 + (200 / (count - 1)) * i,
            gap: Math.random() * Math.PI * 2,
            gapSize: Math.PI / 3,
            angle: 0,
            speed: bSpd * factor * dir,
            hue: hA + (hB - hA) * (i / (count - 1)),
            passed: false,
            alt: Math.random() < 0.5
        });
    }
    loadAtk(pick(Array.from({length: 8}, (_, i) => `audio/atk${i+1}.mp3`)));
    clearSound = new Audio(pick(Array.from({length: 8}, (_, i) => `audio/clr${i+1}.mp3`)));
    loadMidi(pick(Array.from({length: 5}, (_, i) => `midi/melody${i+1}.mid`)));
}

function physics() {
    ball.vy += gravity / steps;
    ball.x += ball.vx; ball.y += ball.vy;
    if (ball.cd > 0) ball.cd--;

    const dx = ball.x - cx, dy = ball.y - cy, dist = Math.sqrt(dx * dx + dy * dy);

    for (let i = rings.length - 1; i >= 0; i--) {
        const r = rings[i];
        r.angle += r.speed;
        if (dist > r.r) { rings.splice(i, 1); continue; }

        if (dist > r.r - ball.r) {
            const a = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
            const s = (r.gap + r.angle + Math.PI * 2) % (Math.PI * 2);
            const e = (s + r.gapSize) % (Math.PI * 2);
            const inGap = s < e ? (a > s && a < e) : (a > s || a < e);

            if (inGap) {
                if (!r.passed) { playClr(); r.passed = true; }
            } else if (ball.cd === 0) {
                const nx = dx / dist, ny = dy / dist, dot = ball.vx * nx + ball.vy * ny;
                ball.vx -= (1 + res) * dot * nx;
                ball.vy -= (1 + res) * dot * ny;
                ball.x = cx + nx * (r.r - ball.r); ball.y = cy + ny * (r.r - ball.r);
                ball.cd = 2; playAtk();
            }
        }
    }
}

function loop() {
    for (let i = 0; i < steps; i++) physics();
    ctx.clearRect(0, 0, 600, 600);
    rings.forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, r.r, r.gap + r.gapSize + r.angle, r.gap + Math.PI * 2 + r.angle);
        ctx.strokeStyle = `hsl(${r.hue}, 70%, 60%)`;
        ctx.lineWidth = 4; ctx.stroke();
    });
    ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = "white"; ctx.fill();
    if (!rings.length && (ball.x < 0 || ball.x > 600 || ball.y < 0 || ball.y > 600)) reset();
    requestAnimationFrame(loop);
}

reset(); loop();
</script>
</body>
</html>
